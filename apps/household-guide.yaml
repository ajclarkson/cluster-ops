---
apiVersion: v1
kind: Namespace
metadata:
  name: household-guide
---
# Read-only deploy key for the private homeOS repo. 1Password item "homeos-deploy-key"
# has fields "ssh-privatekey" (OpenSSH key) and "known_hosts" (github.com host key).
# They are rendered into the secret keys git-sync reads by default: "ssh" and "known_hosts".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeos-deploy-key
  namespace: household-guide
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: "${onepassword_vault_name}"
  target:
    creationPolicy: Owner
    template:
      data:
        ssh: "{{ .sshkey }}\n"
        known_hosts: "{{ .knownhosts }}\n"
  data:
    - secretKey: sshkey
      remoteRef:
        key: homeos-deploy-key
        property: ssh-privatekey
    - secretKey: knownhosts
      remoteRef:
        key: homeos-deploy-key
        property: known_hosts
---
# Serve only the guide/ subfolder: the repo also holds feature plans and internal docs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: household-guide-nginx
  namespace: household-guide
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /git/current/guide;
      index index.html;
      location / {
        try_files $uri $uri/ =404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: household-guide
  namespace: household-guide
  labels:
    app.kubernetes.io/name: household-guide
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: household-guide
  template:
    metadata:
      labels:
        app.kubernetes.io/name: household-guide
    spec:
      securityContext:
        # Makes the mounted SSH key readable by the git-sync user (65533).
        fsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: git-sync-init
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          imagePullPolicy: IfNotPresent
          args:
            - --repo=git@github.com:ajclarkson/homeOS.git
            - --branch=main
            - --root=/git
            - --link=current
            - --ssh-key-file=/etc/git-secret/ssh
            - --ssh-known-hosts=true
            - --ssh-known-hosts-file=/etc/git-secret/known_hosts
            - --one-time
          securityContext:
            runAsUser: 65533
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: git
              mountPath: /git
            - name: git-secret
              mountPath: /etc/git-secret
              readOnly: true
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: git
              mountPath: /git
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # nginx-unprivileged writes its pid and temp files under /tmp.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          imagePullPolicy: IfNotPresent
          args:
            - --repo=git@github.com:ajclarkson/homeOS.git
            - --branch=main
            - --root=/git
            - --link=current
            - --period=60s
            - --ssh-key-file=/etc/git-secret/ssh
            - --ssh-known-hosts=true
            - --ssh-known-hosts-file=/etc/git-secret/known_hosts
          securityContext:
            runAsUser: 65533
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: git
              mountPath: /git
            - name: git-secret
              mountPath: /etc/git-secret
              readOnly: true
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: git
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: household-guide-nginx
        - name: git-secret
          secret:
            secretName: homeos-deploy-key
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: household-guide
  namespace: household-guide
spec:
  selector:
    app.kubernetes.io/name: household-guide
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: household-guide
  namespace: household-guide
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - guide.${local_ingress_domain}
  rules:
    - host: guide.${local_ingress_domain}
      http:
        paths:
          - pathType: ImplementationSpecific
            backend:
              service:
                name: household-guide
                port:
                  name: http
