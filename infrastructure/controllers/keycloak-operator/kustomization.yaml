---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - namespace.yaml
  # CRDs vendored locally (pinned to keycloak-k8s-resources v26.4.0) instead of
  # referenced via raw.githubusercontent.com URL — kustomize fetches remote URL
  # resources on every reconcile, which got rate-limited (429) by GitHub.
  # To bump: re-download the three files below from
  # https://github.com/keycloak/keycloak-k8s-resources/tree/<new-tag>/kubernetes
  - crds/keycloaks.k8s.keycloak.org-v1.yml
  - crds/keycloakrealmimports.k8s.keycloak.org-v1.yml
  - crds/kubernetes.yml
patches:
  - target:
      kind: Deployment
      name: keycloak-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 256Mi
            cpu: 50m
          limits:
            memory: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 10
