---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - namespace.yaml
  # CRDs vendored locally instead of referenced via raw.githubusercontent.com
  # URL — kustomize fetches remote URL resources on every reconcile, which got
  # rate-limited (429) by GitHub. To bump: run
  # scripts/update-keycloak-crds.sh <new-version> and commit the result.
  # Version tracked below by a custom Renovate manager, see renovate.json.
  # CRD_VERSION: 26.4.0
  - crds/keycloaks.k8s.keycloak.org-v1.yml
  - crds/keycloakrealmimports.k8s.keycloak.org-v1.yml
  - crds/kubernetes.yml
patches:
  - target:
      kind: Deployment
      name: keycloak-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 256Mi
            cpu: 50m
          limits:
            memory: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 10
